<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pair Match Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">

    <h2>Pair Match Game</h2>

    <div id="info">
        Moves: <span id="mv">0</span>

        Pairs: <span id="pr">0</span>

    <h3 id="win"></h3>

    <button id="rbtn">Restart Game</button>

</div>

<script src="script.js"></script>

</body>
</html>
